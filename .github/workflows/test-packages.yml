name: Test Packed Artifacts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only newer commits to the same PR may replace a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.112'

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  library-package:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'NuGet library targets'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack and check all library targets
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'evx-library-packages'
          $version = (Import-PowerShellDataFile ./PSEventViewer.psd1).ModuleVersion
          foreach ($name in @('EventViewerX', 'EventViewerX.Detection', 'EventViewerX.Evtx', 'EventViewerX.Reporting', 'EventViewerX.Storage')) {
            dotnet pack "Sources/$name/$name.csproj" --configuration Release --output $packageRoot -p:NuGetAudit=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./Build/Test-LibraryPackageTargets.ps1 -PackageRoot $packageRoot -Version $version

  cli-package:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'CLI tool (${{ matrix.os }})'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install package validation owner
        shell: pwsh
        run: Install-Module PSPublishModule -MinimumVersion 3.0.151 -Scope CurrentUser -Force -AllowClobber
      - name: Pack and validate the CLI tool
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP 'evx-cli-packages'
          dotnet pack Sources/EventViewerX.Cli/EventViewerX.Cli.csproj --configuration Release --output $packageRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Build/Test-CliPackage.ps1 -PackageRoot $packageRoot

  module-package:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'PowerShell ZIP (5.1 and 7)'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install package validation owner
        shell: pwsh
        run: Install-Module PSPublishModule -MinimumVersion 3.0.151 -Scope CurrentUser -Force -AllowClobber
      - name: Build and validate the module ZIP
        shell: pwsh
        run: |
          Import-Module PSPublishModule -ErrorAction Stop
          $version = (Import-PowerShellDataFile ./PSEventViewer.psd1).ModuleVersion
          Invoke-ModuleBuild -ConfigPath ./Build/module.json -RunMode Build -ModuleVersion $version -NoSign -IncludeProjectPackages:$false -NoInteractive -StagingPath (Join-Path $env:RUNNER_TEMP 'evx-module-stage')
          ./Build/Test-ModulePackage.ps1 -ModuleArchive (Join-Path $PWD "Artefacts/Packed/PSEventViewer.v$version.zip") -Version $version

  result:
    name: Test Packed Artifacts result
    needs: [changes, library-package, cli-package, module-package]
    if: always()
    uses: ./.github/workflows/ci-result.yml
    with:
      results: ${{ toJSON(needs) }}
