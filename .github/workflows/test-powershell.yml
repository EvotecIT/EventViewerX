name: Test PowerShell Module

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Only newer commits to the same PR may replace a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.112'
  BUILD_CONFIGURATION: 'Debug'

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  refresh-psd1:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Refresh PSD1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup PowerShell modules
        run: |
          Install-Module PSPublishModule -Force -Scope CurrentUser -AllowClobber
        shell: pwsh

      - name: Test release selection
        run: |
          .\Build\Test-ReleaseConfiguration.ps1
          .\Build\Test-ReleasePlans.ps1
        shell: pwsh

      - name: Refresh module manifest
        run: |
          .\Build\Build-Module.ps1 -ConfigurationGateMode Manifest
        shell: pwsh

      - name: Upload refreshed manifest
        uses: actions/upload-artifact@v7
        with:
          name: psd1
          path: PSEventViewer.psd1

  test-windows-ps5:
    needs: [changes, refresh-psd1]
    if: needs.changes.outputs.build == 'true'
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: powershell
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSSharedGoods -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/EventViewerX.sln
          dotnet build Sources/EventViewerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: powershell
        run: .\PSEventViewer.Tests.ps1

  test-windows-ps7:
    needs: [changes, refresh-psd1]
    if: needs.changes.outputs.build == 'true'
    name: 'Windows PowerShell 7'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: psd1
          path: .

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
          Install-Module -Name PSSharedGoods -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber

      - name: Build .NET solution
        run: |
          dotnet restore Sources/EventViewerX.sln
          dotnet build Sources/EventViewerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run PowerShell tests
        shell: pwsh
        run: .\PSEventViewer.Tests.ps1

  result:
    name: Test PowerShell Module result
    needs: [changes, refresh-psd1, test-windows-ps5, test-windows-ps7]
    if: always()
    uses: ./.github/workflows/ci-result.yml
    with:
      results: ${{ toJSON(needs) }}
