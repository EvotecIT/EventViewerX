name: Test Native CLI Archives

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Only newer commits to the same PR may replace a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.112'

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  native-archives:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Native CLI archives (${{ matrix.runtime }})'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # macOS coverage stays on master pushes and manual runs.
      matrix: ${{ fromJSON(needs.changes.outputs.archives) }}
    runs-on: ${{ matrix.os }}
    env:
      POWERFORGE_GIT_PATH: ${{ matrix.git-path }}
    steps:
      - name: Preserve source line endings during checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - name: Prepare the supported macOS SDK installation directory
        if: runner.os == 'macOS'
        shell: bash
        run: sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /usr/local/share/dotnet
      - uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ matrix.dotnet-root }}
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install shared archive build and validation owner
        shell: pwsh
        run: Install-Module PSPublishModule -MinimumVersion 3.0.155 -Scope CurrentUser -Force -AllowClobber
      - name: Build and qualify native archives
        shell: pwsh
        run: |
          git status --short
          dotnet --version
          ./Build/Test-NativeCliArchives.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'evx-native-archives') `
            -EvidencePath (Join-Path $env:RUNNER_TEMP 'evx-native-evidence/qualification.json')
      - name: Retain native qualification evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cli-native-${{ matrix.runtime }}
          path: ${{ runner.temp }}/evx-native-evidence/qualification.json
          retention-days: 14
          if-no-files-found: warn

  result:
    name: Test Native CLI Archives result
    needs: [changes, native-archives]
    if: always()
    uses: ./.github/workflows/ci-result.yml
    with:
      results: ${{ toJSON(needs) }}
