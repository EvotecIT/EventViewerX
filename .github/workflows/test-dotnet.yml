name: Test .NET Libraries

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Only newer commits to the same PR may replace a run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: 'Debug'
  TEST_VERBOSITY: minimal # set to 'detailed' to restore full test output
  SUMMARIZE_FAILURES: true # set to 'false' to disable summarizing failing tests

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  test-portability-linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Linux portability'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.112'

      - name: Restore portability tests
        run: dotnet restore Sources/EventViewerX.Portability.Tests/EventViewerX.Portability.Tests.csproj

      - name: Run retained EVTX portability tests
        run: dotnet test Sources/EventViewerX.Portability.Tests/EventViewerX.Portability.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx
        timeout-minutes: 10

      - name: Upload portability test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-linux-portability
          path: '**/*.trx'

  test-windows:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: 'Windows'
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.112']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore Sources/EventViewerX.sln

      - name: Build solution
        run: dotnet build Sources/EventViewerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

      - name: Run tests (all TFMs)
        run: dotnet test Sources/EventViewerX.sln --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage"
        timeout-minutes: 30

      - name: Strict Release build with NuGet audit
        run: dotnet build Sources/EventViewerX.sln --configuration Release --no-restore -p:NuGetAudit=true -warnaserror

      - name: Publish and run NativeAOT explicit catalog smoke test
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'eventviewerx-aot-smoke'
          dotnet publish Sources/EventViewerX.AotSmoke/EventViewerX.AotSmoke.csproj `
            --configuration Release `
            --output $output
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & (Join-Path $output 'EventViewerX.AotSmoke.exe')
          exit $LASTEXITCODE

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//UnitTestResult[@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-windows-${{ matrix.dotnet-version }}
          path: '**/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports-windows-${{ matrix.dotnet-version }}
          path: '**/coverage.cobertura.xml'

      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: '**/coverage.cobertura.xml'
          verbose: true

  result:
    name: Test .NET Libraries result
    needs: [changes, test-portability-linux, test-windows]
    if: always()
    uses: ./.github/workflows/ci-result.yml
    with:
      results: ${{ toJSON(needs) }}
